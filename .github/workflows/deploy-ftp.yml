name: Déploiement FTP (OVH)

# Déploie la planche tarifaire (front Angular) sur OVH par FTP, sans machine locale.
# - Se lance automatiquement à chaque push sur `main`.
# - Peut aussi se lancer à la main : onglet « Actions » → ce workflow → « Run workflow ».
#
# ⚠️ Réglages à faire une seule fois dans GitHub
#    (Settings → Secrets and variables → Actions) :
#      • Secret   FTP_PASSWORD     = mot de passe FTP OVH (obligatoire).
#      • Variable FTP_REMOTE_PATH  = dossier cible sur le serveur.
#        Par défaut « /public_html/planche/ » — À CONFIRMER selon l'URL réelle
#        de la planche (voir CLAUDE.md). Le backend PHP n'est jamais touché.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ftp-planchecloe
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Build de production
        run: npx ng build --configuration production --base-href ./

      - name: Envoi FTP vers OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.FTP_HOST || 'ftp.chcl8760.odns.fr' }}
          username: ${{ vars.FTP_USER || 'chcl8760' }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/planche-cloe/browser/
          server-dir: ${{ vars.FTP_REMOTE_PATH || '/public_html/planche/' }}
          # Ne touche jamais au backend PHP ni aux données du serveur.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            backend/**
            **/.htaccess
            **/.user.ini
