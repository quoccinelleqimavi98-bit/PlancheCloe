name: Déploiement GitHub Pages

# Déploie la planche tarifaire sur GitHub Pages, sans machine locale.
# - Se lance automatiquement à chaque push sur `main`.
# - Peut aussi se lancer à la main : onglet « Actions » → ce workflow → « Run workflow ».
#
# ⚙️ Réglage à faire UNE SEULE FOIS sur GitHub :
#    Settings → Pages → Build and deployment → Source = « GitHub Actions ».
#    (Aucun secret nécessaire : GitHub gère l'authentification tout seul.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Build de production
        run: npx ng build --configuration production --base-href ./

      - name: Configuration Pages
        uses: actions/configure-pages@v5

      - name: Préparation de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/planche-cloe/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Mise en ligne sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
